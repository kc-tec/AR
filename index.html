<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; }
        code { background-color: #f4f4f4; padding: 2px 4px; border-radius: 4px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>Book Content</h1>

    <div id="content"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // 2. Fetch the content of your Markdown file
        fetch('book.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(markdownText => {
                // 3. Find the container element
                const contentDiv = document.getElementById('content');
                
                // 4. Convert Markdown to HTML and set it using .innerHTML
                // This is the key step. .innerHTML renders HTML tags.
                // Using .textContent would show the tags as plain text.
                contentDiv.innerHTML = marked.parse(markdownText);
            })
            .catch(error => {
                console.error('Error fetching or parsing Markdown:', error);
                document.getElementById('content').textContent = 'Error: Could not load the book content.';
            });
    </script>

</body>
</html>
